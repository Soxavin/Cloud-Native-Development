# Public entry point: only the gateway is exposed outside the cluster
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-login
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000

---
# Internal only: the gateway reaches registration at http://registration-service:3001
apiVersion: v1
kind: Service
metadata:
  name: registration-service
spec:
  type: ClusterIP
  selector:
    app: registration
  ports:
    - port: 3001
      targetPort: 3001
