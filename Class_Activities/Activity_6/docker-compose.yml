services:
  registration:
    build: ./Registration_Microservice
    container_name: registration-service
    ports:
      - "5001:5001"
    env_file:
      - ./Registration_Microservice/.env
    restart: unless-stopped

  login:
    build: ./Authentication_Microservice
    container_name: login-service
    ports:
      - "5002:5002"
    env_file:
      - ./Authentication_Microservice/.env
    restart: unless-stopped