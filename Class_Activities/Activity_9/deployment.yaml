# Pod 1: api-gateway + login (two containers, one pod)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-login
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-login
  template:
    metadata:
      labels:
        app: gateway-login
    spec:
      containers:
        - name: login
          image: soxavin/shop-login:v1
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10

        - name: api-gateway
          image: soxavin/shop-api-gateway:v1
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: JWT_SECRET
            # login is in this same pod, so localhost works
            - name: LOGIN_URL
              value: "http://localhost:3002"
            # registration is in the other pod, so go through its Service name
            - name: REGISTRATION_URL
              value: "http://registration-service:3001"
            # The gateway crashes on startup if any of these are missing, even for
            # services we are not deploying. Placeholders keep it alive.
            - name: BOOKING_URL
              value: "http://unused:3003"
            - name: VEHICLES_URL
              value: "http://unused:3004"
            - name: WORK_ORDERS_URL
              value: "http://unused:3005"
            - name: NOTES_URL
              value: "http://unused:3006"
            - name: BILLING_URL
              value: "http://unused:3007"
            - name: CATALOG_URLS
              value: "http://unused:3008"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

---
# Pod 2: registration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registration
  template:
    metadata:
      labels:
        app: registration
    spec:
      containers:
        - name: registration
          image: soxavin/shop-registration:v1
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: MONGO_URI
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
